version: "3"
services: 
  influxdb:
    image: influxdb
    container_name: influxdb
    ports:
      - "8086:8086"        
    env_file:
      - 'influxdb.env'
    volumes:
      - "influxdb-data:/var/lib/influxdb"

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    env_file:
      - 'grafana.env'
    user: "0"
    volumes:
      - "grafana-data:/var/lib/grafana"
  
  node-red:
    image: nodered/node-red:4.0.2-debian
    container_name: node-red
    ports:
      - "1880:1880"
    depends_on:
      - influxdb
      - mosquitto
    volumes:
      - "./node-red/data:/data"
    networks:
      - common_network
    environment: 
      - TZ=UTC+1
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - "mosquitto-data:/mosquitto"


networks:
  common_network:
    name: docker-influxdb-grafana-nodered-mqtt_common_network


volumes:
  influxdb-data:
  grafana-data:        
  node-red-data:
  mosquitto-data:


